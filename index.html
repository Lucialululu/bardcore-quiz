<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a120e">
  <title>Bardcore Quiz</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪕</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="narrow-wrap">
    <div class="phone-head">
      <div class="brand">Bardcore Quiz</div>
      <div class="caps small muted" id="status-line"></div>
    </div>

    <!-- JOIN -->
    <section data-screen="join">
      <div id="demo-banner" class="banner" hidden>Demo mode: this only works in another tab on the same computer as the host.</div>
      <form class="card" id="join-form" autocomplete="off">
        <label>Room code<input class="code-input" id="in-code" maxlength="4" inputmode="text" autocapitalize="characters" required placeholder="ABCD"></label>
        <div style="height:14px"></div>
        <label>Your name (or team name)<input id="in-name" maxlength="20" required placeholder="Sir Lancelot"></label>
        <div style="height:18px"></div>
        <button class="primary big" style="width:100%" id="btn-join">Join the quiz</button>
        <p class="feedback wrong small" id="join-error"></p>
      </form>
      <p class="footer-link"><a href="host.html">Host a quiz</a></p>
    </section>

    <!-- WAITING -->
    <section data-screen="wait" hidden>
      <div class="card center">
        <div class="caps muted small">You're in!</div>
        <h1 class="blackletter" style="font-size:44px;color:var(--wine)" id="wait-name"></h1>
        <p id="wait-text">Eyes on the big screen. The quiz will start soon.</p>
        <p class="muted small" id="wait-count"></p>
      </div>
    </section>

    <!-- QUESTION -->
    <section data-screen="question" hidden>
      <div class="row spread" style="margin-bottom:6px">
        <span class="caps" id="pq-label">Song 1 of 10</span>
        <span class="caps" id="pq-score">0 pts</span>
      </div>
      <div class="phone-timer" id="pq-timer">30</div>
      <div class="bar" style="margin:8px 0 16px"><div id="pq-bar"></div></div>

      <div class="card">
        <div id="title-area">
          <form class="guess-form" id="title-form" autocomplete="off">
            <input class="guess-input" id="title-input" placeholder="Song title…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
            <button class="primary">Guess</button>
          </form>
          <div class="feedback" id="title-fb"></div>
          <div class="tries" id="title-tries"></div>
        </div>
        <div id="title-solved" class="solved-box" hidden></div>

        <div id="artist-wrap" hidden>
          <hr style="border:0;border-top:1px dashed #c9b38a;margin:18px 0">
          <div class="caps small muted" style="margin-bottom:8px">Bonus: original artist</div>
          <div id="artist-area">
            <form class="guess-form" id="artist-form" autocomplete="off">
              <input class="guess-input" id="artist-input" placeholder="Artist…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
              <button class="gold">Guess</button>
            </form>
            <div class="feedback" id="artist-fb"></div>
            <div class="tries" id="artist-tries"></div>
          </div>
          <div id="artist-solved" class="solved-box" hidden></div>
        </div>
      </div>
      <div class="card center" id="locked-box" hidden>⏳ <b>Time's up!</b> Look at the big screen.</div>
    </section>

    <!-- REVEAL -->
    <section data-screen="reveal" hidden>
      <div class="card center">
        <div class="caps muted small">It was…</div>
        <h1 class="blackletter" style="font-size:40px;color:var(--wine);margin:6px 0" id="pr-title"></h1>
        <div class="caps" id="pr-artist"></div>
        <hr style="border:0;border-top:1px dashed #c9b38a;margin:18px 0">
        <div style="font-size:28px;font-weight:600" id="pr-points"></div>
        <p id="pr-rank"></p>
      </div>
      <p class="center muted">Next song coming up…</p>
    </section>

    <!-- FINAL -->
    <section data-screen="final" hidden>
      <div class="center caps muted" style="margin-top:20px">You finished</div>
      <div class="my-rank" id="pf-rank">#1</div>
      <div class="card center" style="margin-top:20px">
        <div style="font-size:24px;font-weight:600" id="pf-score"></div>
        <p id="pf-winner" class="muted"></p>
      </div>
      <p class="center"><button class="ghost" id="btn-leave">Join another game</button></p>
    </section>

    <!-- MESSAGE -->
    <section data-screen="msg" hidden>
      <div class="card center" id="msg-text"></div>
      <p class="center"><button class="ghost" id="btn-msg-back">Back</button></p>
    </section>
  </div>

  <script type="module" src="js/play.js"></script>
</body>
</html>
