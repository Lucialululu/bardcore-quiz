<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Bardcore Quiz: name the song behind the medieval cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4a2e"/>
      <stop offset="0.75" stop-color="#121212"/>
    </linearGradient>
    <clipPath id="pill"><rect x="10" y="10" width="1180" height="280" rx="140"/></clipPath>
  </defs>
  <g clip-path="url(#pill)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <!-- faint equaliser bars along the bottom -->
    <g fill="#1ed760" opacity="0.10" transform="translate(120 0)">
      <rect x="760" y="210" width="14" height="80" rx="4"/><rect x="784" y="170" width="14" height="120" rx="4"/>
      <rect x="808" y="230" width="14" height="60" rx="4"/><rect x="832" y="150" width="14" height="140" rx="4"/>
      <rect x="856" y="200" width="14" height="90" rx="4"/><rect x="880" y="240" width="14" height="50" rx="4"/>
      <rect x="904" y="185" width="14" height="105" rx="4"/><rect x="928" y="160" width="14" height="130" rx="4"/>
      <rect x="952" y="220" width="14" height="70" rx="4"/><rect x="976" y="195" width="14" height="95" rx="4"/>
      <rect x="1000" y="245" width="14" height="45" rx="4"/><rect x="1024" y="175" width="14" height="115" rx="4"/>
      <rect x="1048" y="215" width="14" height="75" rx="4"/><rect x="1072" y="235" width="14" height="55" rx="4"/>
    </g>
  </g>
  <rect x="10.5" y="10.5" width="1179" height="279" rx="139.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- logo -->
  <circle cx="170" cy="150" r="78" fill="#1ed760"/>
  <g transform="translate(116 96) scale(4.5)" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
  </g>

  <text x="290" y="160" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="#ffffff">Bardcore Quiz</text>
  <text x="294" y="214" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#b3b3b3">Name the song behind the medieval cover</text>
</svg>
